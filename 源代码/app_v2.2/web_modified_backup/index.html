<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智驱·链析</title>
  <link rel="stylesheet" href="/web/css/dashboard.css?v=20260423" />
  <style>
    .title{position:fixed;left:30px;top:20px;color:#fff;font-size:18px;opacity:.85;z-index:20;}
    .chat-box{
      position:fixed;right:15px;top:20px;bottom:20px;width:390px;z-index:20;
      background:rgba(18,18,18,.55);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);
      border-radius:20px;border:1px solid rgba(255,255,255,.08);
      box-shadow:0 0 40px rgba(255,255,255,.06), inset 0 0 20px rgba(255,255,255,.03);
      display:flex;flex-direction:column;overflow:hidden;
    }
    .chat-header{padding:14px 16px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .chat-header .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
    .chat-header .tools button{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#ddd;font-size:11px;padding:4px 8px;border-radius:8px;cursor:pointer;}
    .chat-status{padding:6px 12px 0;min-height:16px;font-size:11px;color:#90f4bf;}
    .chat-error{padding:2px 12px 0;min-height:16px;font-size:11px;color:#ff9f9f;}
    .chat-content{flex:1;padding:12px;overflow:auto;color:#ddd;font-size:13px;line-height:1.6;}
    .msg{margin:8px 0;white-space:pre-wrap;word-break:break-word;}
    .msg.user{text-align:right;color:#ffd28a;}
    .msg.bot{text-align:left;color:#fff;}
    .msg.sys{text-align:left;color:#9fc7ff;}
    .chat-input{display:flex;padding:12px;gap:10px;border-top:1px solid rgba(255,255,255,.08);}
    .chat-input input{flex:1;background:rgba(255,255,255,.06);border:none;border-radius:12px;color:#fff;padding:12px;outline:none;}
    .chat-input button{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,#7c5cff,#00d4ff);color:#001018;cursor:pointer;box-shadow:0 0 18px rgba(0,212,255,.35);}
    .evidence-panel{display:none;position:absolute;right:12px;bottom:74px;z-index:30;width:360px;max-height:260px;background:rgba(10,10,15,.94);border:1px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45);}
    .evidence-panel.open{display:flex;flex-direction:column;}
    .evidence-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.08);color:rgba(234,240,255,.85);font-size:11px;}
    .evidence-head button{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#ddd;font-size:11px;padding:3px 8px;border-radius:8px;cursor:pointer;}
    .evidence-body{padding:10px;font-size:11px;color:#ddd;white-space:pre-wrap;overflow:auto;max-height:210px;line-height:1.45;}
    @media (max-width:900px){
      .chat-box{left:12px;right:12px;top:12px;bottom:12px;width:auto;}
      .evidence-panel{left:12px;right:12px;width:auto;}
      .title{display:none;}
    }
  </style>
</head>
<body>
  <div class="title">智驱·链析</div>

  <div id="chartPanel" aria-label="数据分析大屏">
    <div class="chart-head">
      <h2>数据分析大屏</h2>
      <div class="chart-tools">
        <button type="button" id="collapseChartBtn" aria-label="收起左侧大屏">收起</button>
      </div>
    </div>
    <div id="chartContent"></div>
  </div>

  <div class="chat-box">
    <div class="chat-header">
      <span>AI 助手</span>
      <div class="tools">
        <button type="button" id="toggleChartBtn">左侧大屏</button>
        <button type="button" id="newSessionBtn">新建会话</button>
        <button type="button" id="btnEvidence">证据</button>
        <button type="button" id="logoutBtn">退出</button>
      </div>
    </div>
    <div id="agentStatus" class="chat-status"></div>
    <div id="agentError" class="chat-error"></div>
    <div class="chat-content" id="chat"></div>
    <div class="evidence-panel" id="evidencePanel">
      <div class="evidence-head"><span>可追溯证据</span><button type="button" id="refreshSourcesBtn">刷新</button></div>
      <div class="evidence-body" id="sourcePanel">暂无证据</div>
    </div>
    <div class="chat-input">
      <input id="input" placeholder="猜你想问：比亚迪2023年销量 / 对比比亚迪、长城、蔚来、理想、小鹏" autocomplete="off">
      <button id="sendBtn" type="button">↑</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="/web/js/app.js?v=20260423"></script>
</body>
</html>

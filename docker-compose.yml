services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: app_v2
      POSTGRES_USER: app_v2
      POSTGRES_PASSWORD: app_v2
    ports:
      - "5432:5432"
    volumes:
      - pg_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_v2 -d app_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      APP_NAME: app_v2
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+asyncpg://app_v2:app_v2@postgres:5432/app_v2
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data_v2:
